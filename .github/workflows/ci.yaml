
name: Hello World CI Pipeline

on:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        run: echo "Build completed successfully!"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test message
        run: echo "Tests completed successfully!"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy message
        run: echo "Deploy completed successfully!"
